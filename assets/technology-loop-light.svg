
<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Tecnologia conectando operação e estratégia</title>
  <desc id="description">Fluxo animado que conecta negócio, ERP e CRM, APIs, automação, dados, inteligência artificial e decisão para gerar escala.</desc>
  <defs>
    <linearGradient id="flow" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00AEFF"/>
      <stop offset="0.52" stop-color="#5128B5"/>
      <stop offset="1" stop-color="#00AEFF"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="cycle-path" d="M120 204H1080C1112 204 1112 292 1080 292H120C88 292 88 204 120 204"/>
  </defs>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .cycle { animation: dash 10s linear infinite; }
    .status { transform-box: fill-box; transform-origin: center; animation: pulse 7s ease-in-out infinite; }
    .s2 { animation-delay: -1s; }
    .s3 { animation-delay: -2s; }
    .s4 { animation-delay: -3s; }
    .s5 { animation-delay: -4s; }
    .s6 { animation-delay: -5s; }
    .s7 { animation-delay: -6s; }
    @keyframes dash { to { stroke-dashoffset: -90; } }
    @keyframes pulse { 0%, 72%, 100% { opacity: .28; transform: scale(.8); } 8%, 18% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .cycle, .status { animation: none; }
      .status { opacity: .65; transform: none; }
      .packet { display: none; }
    }
  </style>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="#F7F8FA" stroke="#DDE3EA" stroke-width="2"/>

  <text x="60" y="52" fill="#5128B5" font-size="14" font-weight="800" letter-spacing="2.2">ENGENHARIA COM VISÃO DE NEGÓCIO</text>
  <text x="60" y="88" fill="#111827" font-size="26" font-weight="750">Da complexidade operacional à capacidade de escala</text>
  <text x="60" y="116" fill="#5F6B7A" font-size="16">Integro o ecossistema, automatizo fluxos e transformo dados em decisões preparadas para evoluir.</text>

  <path d="M120 204H1080" fill="none" stroke="#D6DCE5" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 204H1080" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
  <path class="cycle" d="M1080 258C1080 302 120 302 120 258" fill="none" stroke="url(#flow)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 11" opacity=".55"/>
  <text x="600" y="294" text-anchor="middle" fill="#6B7280" font-size="12" font-weight="650" letter-spacing="1.3">FEEDBACK · GOVERNANÇA · EVOLUÇÃO CONTÍNUA</text>

  <g>
    <rect x="60" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status" cx="78" cy="176" r="5" fill="#00AEFF"/>
    <text x="120" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">Negócio</text>
    <text x="120" y="220" text-anchor="middle" fill="#667085" font-size="12">problema real</text>
  </g>
  <g>
    <rect x="220" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s2" cx="238" cy="176" r="5" fill="#168FEA"/>
    <text x="280" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">ERP / CRM</text>
    <text x="280" y="220" text-anchor="middle" fill="#667085" font-size="12">operação</text>
  </g>
  <g>
    <rect x="380" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s3" cx="398" cy="176" r="5" fill="#2A72D5"/>
    <text x="440" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">APIs</text>
    <text x="440" y="220" text-anchor="middle" fill="#667085" font-size="12">eventos</text>
  </g>
  <g>
    <rect x="540" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s4" cx="558" cy="176" r="5" fill="#3E55C0"/>
    <text x="600" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">Automação</text>
    <text x="600" y="220" text-anchor="middle" fill="#667085" font-size="12">workflows</text>
  </g>
  <g>
    <rect x="700" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s5" cx="718" cy="176" r="5" fill="#5128B5"/>
    <text x="760" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">Dados / BI</text>
    <text x="760" y="220" text-anchor="middle" fill="#667085" font-size="12">indicadores</text>
  </g>
  <g>
    <rect x="860" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s6" cx="878" cy="176" r="5" fill="#3E55C0"/>
    <text x="920" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">IA aplicada</text>
    <text x="920" y="220" text-anchor="middle" fill="#667085" font-size="12">assistência</text>
  </g>
  <g>
    <rect x="1020" y="158" width="120" height="92" rx="16" fill="#FFFFFF" stroke="#CAD3DE"/>
    <circle class="status s7" cx="1038" cy="176" r="5" fill="#00AEFF"/>
    <text x="1080" y="197" text-anchor="middle" fill="#111827" font-size="16" font-weight="750">Decisão</text>
    <text x="1080" y="220" text-anchor="middle" fill="#667085" font-size="12">escala</text>
  </g>

  <circle class="packet" r="7" fill="#00AEFF" filter="url(#glow)" opacity="0">
    <animateMotion dur="14s" repeatCount="indefinite"><mpath href="#cycle-path"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.98;1" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle class="packet" r="5" fill="#5128B5" filter="url(#glow)" opacity="0">
    <animateMotion begin="-7s" dur="14s" repeatCount="indefinite"><mpath href="#cycle-path"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.98;1" begin="-7s" dur="14s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(204 336)">
    <rect width="240" height="48" rx="24" fill="#EAF7FF" stroke="#B9E7FF"/>
    <circle cx="23" cy="24" r="6" fill="#00AEFF"/>
    <text x="42" y="30" fill="#19415A" font-size="14" font-weight="700">Menos retrabalho</text>
  </g>
  <g transform="translate(480 336)">
    <rect width="240" height="48" rx="24" fill="#F2EDFF" stroke="#D9CBFF"/>
    <circle cx="23" cy="24" r="6" fill="#5128B5"/>
    <text x="42" y="30" fill="#39246E" font-size="14" font-weight="700">Mais previsibilidade</text>
  </g>
  <g transform="translate(756 336)">
    <rect width="240" height="48" rx="24" fill="#EAF7FF" stroke="#B9E7FF"/>
    <circle cx="23" cy="24" r="6" fill="#00AEFF"/>
    <text x="42" y="30" fill="#19415A" font-size="14" font-weight="700">Decisão com dados</text>
  </g>
</svg>
