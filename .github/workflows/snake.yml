name: 🐍 Cobrinha nos Commits

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar animações da grade de contribuições
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=a9a9a9&color_dots=#1e1b2e,#3b1f6e,#6d28d9,#9333ea,#c084fc
            dist/github-contribution-grid-snake-dark.svg?color_snake=bebebe&color_dots=#0d0a1a,#2e1065,#6d28d9,#9333ea,#a855f7

      - name: Publicar animações na branch output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
